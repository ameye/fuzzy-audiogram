name: tests

# The Ruspini sum-to-one guarantee is the claim the manuscript rests on, so it is
# checked on every push against a dense sweep of the decibel axis rather than a
# grid. The rest of the suite covers the partition builder, the pipeline wiring and
# the asymmetry refactor's metrics-neutrality property.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install pytest

      - name: Ruspini partition constraint (continuous, 0-120 dB HL)
        run: python tests/test_ruspini_continuous.py

      - name: Ruspini partition unit tests
        run: python tests/test_ruspini.py

      - name: Pipeline partition integration
        run: python tests/test_pipeline_ruspini.py

      - name: Asymmetry refactor is metrics-neutral
        run: |
          missing=0
          for file in \
            /opt/data/fuzzy-audiogram/archive/predictions_PRE_asymmetry_refactor.pkl \
            /opt/data/fuzzy-audiogram/data/output_participant/metrics_participant.json \
            /opt/data/fuzzy-audiogram/fuzzy_audiogram/combined_data.py \
            /opt/data/fuzzy-audiogram/scripts/pipeline_participant.py \
            /opt/data/{AUX1_9900,DEMO_9900,AUX_G_1112,DEMO_G_1112,AUX_I_1516,DEMO_I_1516}.xpt; do
            if [ ! -f "$file" ]; then
              echo "::warning::Asymmetry verification prerequisite missing: $file"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            python tests/verify_asymmetry_refactor.py
          else
            echo "Skipping asymmetry verification: external baseline or cohort is unavailable."
          fi

      - name: Remaining suite via pytest
        # This standalone calibration analysis is not a pytest test and requires
        # external files at /opt/data.
        run: python -m pytest tests/ -q --ignore=tests/test_ruspini_continuous.py --ignore=tests/calibrate_train_eval_test.py
        continue-on-error: false
