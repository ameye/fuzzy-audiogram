[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "fuzzy-audiogram"
version = "0.1.0"
description = "A fuzzy logic framework for audiogram interpretation — preserving diagnostic gradation lost to crisp dB thresholds"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Sanyaolu Ameye", email = "sanyaameye@hotmail.com"},
]
requires-python = ">=3.10"
dependencies = [
    "scikit-fuzzy>=0.5.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/ameye/fuzzy-audiogram"
Repository = "https://github.com/ameye/fuzzy-audiogram"
Issues = "https://github.com/ameye/fuzzy-audiogram/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
]
viz = [
    "plotly>=5.15",
]

[tool.setuptools.packages.find]
where = ["fuzzy_audiogram"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py310"
