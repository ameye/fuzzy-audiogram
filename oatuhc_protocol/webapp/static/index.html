<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OAUTHC FAI Validation — Data Entry</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js" defer></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
    * { font-family: 'Inter', system-ui, sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace !important; }
    body { background: #07070d; min-height: 100vh; margin: 0; color: #fff; }
    body::before {
      content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse at 20% 30%, rgba(88,28,135,0.14), transparent 55%),
        radial-gradient(ellipse at 80% 70%, rgba(14,116,144,0.10), transparent 55%);
    }
    .glass-card { background: rgba(255,255,255,0.03); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,0.07); border-radius: 14px; }
    .input-dark { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 6px 8px; color: #fff; outline: none; transition: all 0.2s; width: 100%; }
    .input-dark:focus { border-color: rgba(139,92,246,0.5); background: rgba(255,255,255,0.07); }
    .btn-primary { background: rgba(139,92,246,0.15); border: 1px solid rgba(139,92,246,0.35); color: #c4b5fd; border-radius: 10px; padding: 8px 16px; font-weight: 600; transition: all 0.25s; cursor: pointer; }
    .btn-primary:hover { background: rgba(139,92,246,0.25); }
    .btn-ghost { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.7); border-radius: 10px; padding: 8px 16px; transition: all 0.25s; cursor: pointer; }
    .btn-ghost:hover { background: rgba(255,255,255,0.08); }
    .fade-in { animation: fadeIn 0.35s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    select.input-dark option { background: #16162a; color: #fff; }
    [x-cloak] { display: none !important; }
  </style>
</head>
<body>
  <div class="relative z-10 max-w-6xl mx-auto px-6 py-8" x-data="entryApp()" x-init="init()">

    <!-- Header -->
    <header class="flex items-center justify-between mb-6">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-violet-500/15 border border-violet-500/30 flex items-center justify-center text-lg">🗂️</div>
        <div>
          <h1 class="text-xl font-bold">OAUTHC FAI <span class="text-violet-400">Validation</span></h1>
          <p class="text-xs text-white/40">Demographics + thresholds, both ears on one form</p>
        </div>
      </div>
      <div class="flex items-center gap-3 text-xs">
        <span class="w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.6)]"></span>
        <span class="text-white/40" x-text="statusText"></span>
        <span class="text-white/30" x-show="currentUser" x-cloak>
          · signed in as <span class="text-white/50" x-text="currentUser"></span>
        </span>
        <button type="button" class="btn-ghost text-xs px-3 py-1" @click="logout()">Sign out</button>
      </div>
    </header>

    <!-- ══ THE FORM: demographics + both ears ══ -->
    <form class="glass-card p-6 mb-6" @submit.prevent="save()">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-semibold">
          <span x-show="form.patient_id === null">New patient</span>
          <span x-show="form.patient_id !== null" x-cloak>Editing patient <span class="mono text-violet-300">#<span x-text="form.patient_id"></span></span></span>
        </h2>
        <div class="flex gap-2">
          <button type="button" class="btn-ghost text-sm" @click="reset()" x-show="form.patient_id !== null" x-cloak>✕ Cancel edit</button>
          <button type="submit" class="btn-primary text-sm disabled:opacity-40 disabled:cursor-not-allowed"
                  :disabled="saving || !canSave"
                  :title="!canSave ? 'Fix the highlighted thresholds first' : ''"
                  x-text="saving ? 'Saving…' : (form.patient_id === null ? '💾 Save patient' : '💾 Update patient')"></button>
        </div>
      </div>

      <!-- Demographics -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
        <div>
          <label class="text-xs text-white/40">Age (18–110)</label>
          <input type="number" min="18" max="110" class="input-dark mono" x-model.number="form.age_years">
        </div>
        <div>
          <label class="text-xs text-white/40">Sex</label>
          <select class="input-dark" x-model.number="form.sex">
            <option :value="null">—</option>
            <option value="1">Male</option>
            <option value="2">Female</option>
          </select>
        </div>
        <div>
          <label class="text-xs text-white/40">Test (Mon YYYY)</label>
          <input type="text" class="input-dark mono" placeholder="Mar 2023" x-model="form.test_month_year">
        </div>
        <div>
          <label class="text-xs text-white/40">Operator</label>
          <input type="text" class="input-dark" x-model="form.created_by">
        </div>
      </div>

      <!-- Both ears side by side. Ordered RIGHT then LEFT to follow the
           audiogram convention: the right ear is plotted on the viewer's left,
           facing the patient. Colours stay with the ear (red = right,
           blue = left) regardless of position. -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <template x-for="side in ['right','left']" :key="side">
          <div class="rounded-xl p-4" :class="side==='left' ? 'bg-sky-500/[0.04] border border-sky-500/20' : 'bg-rose-500/[0.04] border border-rose-500/20'">
            <div class="flex items-center justify-between mb-3">
              <h3 class="font-semibold text-sm" :class="side==='left' ? 'text-sky-300' : 'text-rose-300'"
                  x-text="side==='left' ? 'Left ear' : 'Right ear'"></h3>
              <label class="flex items-center gap-2 text-xs text-white/50">
                <input type="checkbox" x-model="ears[side].enabled"> include this ear
              </label>
            </div>

            <div x-show="ears[side].enabled" x-cloak>
              <!-- Air conduction -->
              <label class="text-[11px] text-white/40 block mb-1">Air conduction (dB HL, −10…120)</label>
              <div class="grid grid-cols-8 gap-1 mb-3">
                <template x-for="f in FREQS" :key="side+f[0]">
                  <div>
                    <div class="text-[10px] text-white/40 text-center mb-1 mono" x-text="f[0]"></div>
                    <input type="number" step="5" min="-10" max="120"
                           class="input-dark text-center mono text-xs px-1"
                           :class="thBad(side, f[1]) ? '!border-rose-500/70 !bg-rose-500/10' : ''"
                           :title="thBad(side, f[1]) ? 'Must be between -10 and 120 dB HL' : ''"
                           :value="ears[side][f[1]] ?? ''"
                           @input="setTh(side, f[1], $event.target.value)">
                  </div>
                </template>
              </div>

              <!-- Bone conduction -->
              <label class="text-[11px] text-white/40 block mb-1">Bone conduction (optional)</label>
              <div class="grid grid-cols-4 gap-1 mb-3">
                <template x-for="f in BCFREQS" :key="side+f[0]">
                  <div>
                    <div class="text-[10px] text-white/40 text-center mb-1 mono" x-text="f[0]"></div>
                    <input type="number" step="5" min="-10" max="120"
                           class="input-dark text-center mono text-xs px-1"
                           :class="thBad(side, f[1]) ? '!border-rose-500/70 !bg-rose-500/10' : ''"
                           :title="thBad(side, f[1]) ? 'Must be between -10 and 120 dB HL' : ''"
                           :value="ears[side][f[1]] ?? ''"
                           @input="setTh(side, f[1], $event.target.value)">
                  </div>
                </template>
              </div>

              <p x-show="thErrors(side).length" x-cloak
                 class="text-[11px] text-rose-300 mb-3"
                 x-text="'⚠ ' + thErrors(side).join(' · ')"></p>

              <!-- Clinical fields -->
              <div class="grid grid-cols-3 gap-2 mb-3">
                <div>
                  <label class="text-[11px] text-white/40">Diagnosis</label>
                  <select class="input-dark text-xs" x-model="ears[side].diagnosis_category">
                    <option :value="null">—</option>
                    <template x-for="d in DIAGS" :key="side+d"><option :value="d" x-text="d"></option></template>
                  </select>
                </div>
                <div>
                  <label class="text-[11px] text-white/40">Grade (documented)</label>
                  <select class="input-dark text-xs" x-model="ears[side].consultant_grade">
                    <option :value="null">—</option>
                    <template x-for="g in GRADES" :key="side+g"><option :value="g" x-text="g"></option></template>
                  </select>
                </div>
                <div>
                  <label class="text-[11px] text-white/40">Shape</label>
                  <select class="input-dark text-xs" x-model="ears[side].documented_shape">
                    <option :value="null">—</option>
                    <template x-for="s in SHAPES" :key="side+s"><option :value="s" x-text="s"></option></template>
                  </select>
                </div>
              </div>

              <div class="grid grid-cols-3 gap-2 mb-3">
                <div>
                  <label class="text-[11px] text-white/40">Included?</label>
                  <select class="input-dark text-xs" x-model.number="ears[side].ear_included">
                    <option :value="null">—</option>
                    <option value="1">1 — eligible</option>
                    <option value="0">0 — excluded</option>
                  </select>
                </div>
                <div class="col-span-2">
                  <label class="text-[11px] text-white/40">Exclusion reason</label>
                  <input type="text" class="input-dark text-xs" x-model="ears[side].exclusion_reason"
                         :disabled="ears[side].ear_included !== 0">
                </div>
              </div>

              <!-- Live derived -->
              <div class="grid grid-cols-4 gap-2 text-center">
                <div class="bg-white/[0.03] rounded-lg py-2">
                  <div class="text-[10px] text-white/40">PTA-4</div>
                  <div class="mono text-sm font-semibold text-violet-300" x-text="derived(side).pta4 != null ? derived(side).pta4 + ' dB' : '—'"></div>
                </div>
                <div class="bg-white/[0.03] rounded-lg py-2">
                  <div class="text-[10px] text-white/40">WHO grade</div>
                  <div class="mono text-sm" x-text="derived(side).who ?? '—'"></div>
                </div>
                <div class="bg-white/[0.03] rounded-lg py-2">
                  <div class="text-[10px] text-white/40">Borderline</div>
                  <div class="mono text-sm" :class="derived(side).borderline === 1 ? 'text-amber-300' : ''"
                       x-text="derived(side).borderline === 1 ? 'yes' : (derived(side).borderline === 0 ? 'no' : '—')"></div>
                </div>
                <div class="bg-white/[0.03] rounded-lg py-2">
                  <div class="text-[10px] text-white/40">Mono</div>
                  <div class="mono text-sm" :class="derived(side).mono ? 'text-rose-300' : 'text-emerald-300'"
                       x-text="derived(side).mono ? 'FLAG' : 'ok'"></div>
                </div>
              </div>
            </div>

            <p x-show="!ears[side].enabled" x-cloak class="text-xs text-white/30 py-6 text-center">
              Ear not included — tick above to enter thresholds.
            </p>
          </div>
        </template>
      </div>
    </form>

    <!-- Saved records -->
    <div class="glass-card p-6 mb-4">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-semibold">Recorded patients <span class="text-white/30 text-sm" x-text="'(' + patients.length + ')'"></span></h2>
        <button type="button" class="btn-ghost text-sm" @click="exportCsv()">⬇ Export CSV</button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="text-left text-white/40 text-xs uppercase">
              <th class="pb-2">Patient</th><th class="pb-2">Age</th><th class="pb-2">Sex</th>
              <th class="pb-2">Ears</th><th class="pb-2">Included</th><th class="pb-2 w-20"></th>
            </tr>
          </thead>
          <tbody>
            <template x-for="p in patients" :key="p.patient_id">
              <tr class="border-t border-white/5 hover:bg-white/[0.03]">
                <td class="py-2.5 mono text-violet-300">#<span x-text="p.patient_id"></span></td>
                <td class="py-2.5" x-text="p.age_years ?? '—'"></td>
                <td class="py-2.5" x-text="p.sex === 1 ? 'M' : (p.sex === 2 ? 'F' : '—')"></td>
                <td class="py-2.5" x-text="(p.ear_count || 0) + ' / 2'"></td>
                <td class="py-2.5" x-text="p.included_ears ?? 0"></td>
                <td class="py-2.5 text-right">
                  <button type="button" class="btn-ghost text-xs px-2 py-1" @click="edit(p.patient_id)">Edit</button>
                </td>
              </tr>
            </template>
            <tr x-show="!patients.length"><td colspan="6" class="py-8 text-center text-white/30 text-sm">No patients yet — fill the form above.</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Batch QA -->
    <div class="glass-card p-5 text-sm">
      <div class="flex items-center justify-between mb-2">
        <h3 class="font-semibold">Batch QA</h3>
        <button type="button" class="btn-ghost text-xs" @click="loadQA()">Refresh</button>
      </div>
      <div class="text-white/60" x-text="qaText"></div>
    </div>

    <!-- Footer / branding -->
    <footer class="mt-10 pb-4 text-center text-xs text-white/30">
      Designed By <span class="text-white/55 font-medium">Dr. Sanyaolu A. Ameye</span>
    </footer>

    <!-- Toast -->
    <div x-show="toast" x-cloak
         class="fixed bottom-6 right-6 border text-sm rounded-xl p-4 max-w-sm z-50 fade-in"
         :class="toastError ? 'bg-rose-500/15 border-rose-500/30 text-rose-300' : 'bg-emerald-500/15 border-emerald-500/30 text-emerald-300'">
      <span x-text="toast"></span><button type="button" class="ml-3" @click="toast=null">✕</button>
    </div>
  </div>

  <script>
    const FREQS   = [['250','th_250'],['500','th_500'],['1k','th_1k'],['2k','th_2k'],
                     ['3k','th_3k'],['4k','th_4k'],['6k','th_6k'],['8k','th_8k']];
    const BCFREQS = [['500','bc_500'],['1k','bc_1k'],['2k','bc_2k'],['4k','bc_4k']];
    // Physiologically plausible dB HL range (data_dictionary.md v1.0, rule 5).
    const TH_MIN = -10, TH_MAX = 120;
    const FREQ_LABEL = {'250':'250 Hz','500':'500 Hz','1k':'1 kHz','2k':'2 kHz',
                        '3k':'3 kHz','4k':'4 kHz','6k':'6 kHz','8k':'8 kHz'};
    const DIAGS   = ['csoM','otosclerosis','nihl','presbyacusis','ssnhl',
                     'ototoxicity','meniere','other','not_documented'];
    const GRADES  = ['normal','mild','moderate','moderately_severe','severe','profound'];
    const SHAPES  = ['flat','sloping','notched','rising'];

    function blankEar(enabled) {
      const e = { enabled: enabled, test_month_year: null,
                  diagnosis_category: null, consultant_grade: null, documented_shape: null,
                  ear_included: 1, exclusion_reason: null };
      for (const f of FREQS)   e[f[1]] = null;
      for (const f of BCFREQS) e[f[1]] = null;
      return e;
    }

    function entryApp() {
      return {
        FREQS, BCFREQS, DIAGS, GRADES, SHAPES,
        statusText: '…', saving: false, toast: null, toastError: false,
        currentUser: null,
        patients: [], qaText: '—',
        form: { patient_id: null, age_years: null, sex: null, test_month_year: null, created_by: null },
        ears: { left: blankEar(true), right: blankEar(true) },

        async init() {
          try {
            const r = await fetch('/api/health');
            this.statusText = (await r.json()).status === 'ok' ? 'DB ready' : 'offline';
          } catch (e) { this.statusText = 'offline'; }
          try {
            const s = await fetch('/api/auth/status');
            const d = await s.json();
            this.currentUser = d.user || null;
          } catch (e) { /* header simply omits the name */ }
          await this.loadPatients();
          await this.loadQA();
        },

        // ── helpers ──
        setTh(side, field, raw) {
          this.ears[side][field] = raw === '' ? null : Number(raw);
        },

        thBad(side, field) {
          const v = this.ears[side][field];
          if (v === null || v === undefined) return false;
          return !Number.isFinite(v) || v < TH_MIN || v > TH_MAX;
        },

        thErrors(side) {
          const bad = [];
          for (const f of FREQS) {
            if (this.thBad(side, f[1])) bad.push(FREQ_LABEL[f[0]] + ' air conduction outside ' + TH_MIN + ' to ' + TH_MAX + ' dB HL');
          }
          for (const f of BCFREQS) {
            if (this.thBad(side, f[1])) bad.push(FREQ_LABEL[f[0]] + ' bone conduction outside ' + TH_MIN + ' to ' + TH_MAX + ' dB HL');
          }
          return bad;
        },

        // Saving is blocked while any entered threshold is out of range, and
        // until at least one ear actually carries data.
        get canSave() {
          const anyEar = (this.ears.left.enabled && this.hasData(this.ears.left))
                      || (this.ears.right.enabled && this.hasData(this.ears.right));
          return anyEar
              && this.thErrors('left').length === 0
              && this.thErrors('right').length === 0;
        },

        // A 401 means the session expired — send the user back to the login form.
        async api(url, opts) {
          const r = await fetch(url, opts);
          if (r.status === 401) {
            location.href = '/login';
            throw new Error('Session expired');
          }
          return r;
        },

        async logout() {
          try { await fetch('/api/auth/logout', { method: 'POST' }); } catch (e) { /* ignore */ }
          location.href = '/login';
        },

        reset() {
          this.form = { patient_id: null, age_years: null, sex: null, test_month_year: null, created_by: null };
          this.ears = { left: blankEar(true), right: blankEar(true) };
        },

        hasData(ear) {
          for (const f of FREQS)   if (ear[f[1]] !== null) return true;
          for (const f of BCFREQS) if (ear[f[1]] !== null) return true;
          return ear.diagnosis_category !== null || ear.consultant_grade !== null
              || ear.documented_shape !== null;
        },

        derived(side) {
          const e = this.ears[side];
          const pta4Keys = ['th_500','th_1k','th_2k','th_4k'];
          const vals = pta4Keys.map(k => e[k]);
          let pta4 = null;
          if (vals.every(v => v !== null && v !== undefined)) {
            pta4 = Math.round((vals.reduce((a, b) => a + b, 0) / 4) * 10) / 10;
          }
          let who = null;
          if (pta4 !== null) {
            if (pta4 < 26) who = 'normal';
            else if (pta4 < 41) who = 'mild';
            else if (pta4 < 61) who = 'moderate';
            else if (pta4 < 81) who = 'severe';
            else who = 'profound';
          }
          let borderline = null;
          if (pta4 !== null) {
            borderline = [25, 40, 60, 80].some(b => Math.abs(pta4 - b) <= 5) ? 1 : 0;
          }
          // monotonicity: largest adjacent jump across the 8 AC thresholds
          const seq = FREQS.map(f => e[f[1]]).filter(v => v !== null && v !== undefined);
          let mono = false;
          for (let i = 1; i < seq.length; i++) {
            if (Math.abs(seq[i] - seq[i - 1]) > 40) { mono = true; break; }
          }
          return { pta4, who, borderline, mono };
        },

        // ── data ──
        async loadPatients() {
          try {
            const r = await this.api('/api/patients');
            this.patients = await r.json();
          } catch (e) { this.patients = []; }
        },

        async loadQA() {
          try {
            const r = await this.api('/api/qa');
            const d = await r.json();
            this.qaText = d.issues.length
              ? d.total_ear_records + ' records — ' + d.issues.length + ' flag(s): '
                + d.issues.map(i => '#' + i.study_id + ' ' + i.issue).join('; ')
              : d.total_ear_records + ' records — no flags';
          } catch (e) { this.qaText = 'QA unavailable'; }
        },

        buildPayload() {
          const ears = [];
          for (const side of ['left', 'right']) {
            const e = this.ears[side];
            if (!e.enabled || !this.hasData(e)) continue;
            const rec = {
              ear: side,
              test_month_year: this.form.test_month_year,
              diagnosis_category: e.diagnosis_category,
              consultant_grade: e.consultant_grade,
              documented_shape: e.documented_shape,
              ear_included: e.ear_included,
              exclusion_reason: e.ear_included === 0 ? e.exclusion_reason : null,
            };
            for (const f of FREQS)   rec[f[1]] = e[f[1]];
            for (const f of BCFREQS) rec[f[1]] = e[f[1]];
            ears.push(rec);
          }
          return {
            age_years: this.form.age_years,
            sex: this.form.sex,
            created_by: this.form.created_by,
            ears: ears,
          };
        },

        async save() {
          const payload = this.buildPayload();
          if (!payload.ears.length) {
            this.flash('Enter thresholds for at least one ear.', true);
            return;
          }
          this.saving = true;
          try {
            const editing = this.form.patient_id !== null;
            const url = editing ? '/api/patients/' + this.form.patient_id + '/full' : '/api/patients/full';
            const r = await this.api(url, {
              method: editing ? 'PUT' : 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload),
            });
            if (!r.ok) {
              const d = await r.json().catch(() => ({}));
              let msg = d.detail || ('HTTP ' + r.status);
              if (Array.isArray(msg)) msg = msg.map(m => m.msg || JSON.stringify(m)).join('; ');
              this.flash(msg, true);
              return;
            }
            const out = await r.json();
            this.flash((editing ? 'Updated patient #' : 'Saved patient #') + out.patient_id
                       + ' (' + out.ears + ' ear record(s))', false);
            this.reset();
            await this.loadPatients();
            await this.loadQA();
          } catch (e) {
            this.flash('Network error: ' + e.message, true);
          } finally {
            this.saving = false;
          }
        },

        async edit(pid) {
          try {
            const r = await this.api('/api/patients/' + pid);
            const d = await r.json();
            const left = blankEar(false), right = blankEar(false);
            let testMY = null;
            for (const rec of d.ears) {
              const target = rec.ear === 'left' ? left : right;
              target.enabled = true;
              for (const f of FREQS)   target[f[1]] = rec[f[1]];
              for (const f of BCFREQS) target[f[1]] = rec[f[1]];
              target.diagnosis_category = rec.diagnosis_category;
              target.consultant_grade = rec.consultant_grade;
              target.documented_shape = rec.documented_shape;
              target.ear_included = rec.ear_included;
              target.exclusion_reason = rec.exclusion_reason;
              if (rec.test_month_year) testMY = rec.test_month_year;
            }
            this.ears = { left: left, right: right };
            this.form = {
              patient_id: d.patient.patient_id,
              age_years: d.patient.age_years,
              sex: d.patient.sex,
              test_month_year: testMY,
              created_by: d.patient.created_by,
            };
            window.scrollTo({ top: 0, behavior: 'smooth' });
          } catch (e) {
            this.flash('Could not load patient: ' + e.message, true);
          }
        },

        flash(msg, isError) {
          this.toast = msg;
          this.toastError = !!isError;
          clearTimeout(this._toast);
          this._toast = setTimeout(() => { this.toast = null; }, 6000);
        },

        exportCsv() { window.location.href = '/api/export.csv'; },
      };
    }
  </script>
</body>
</html>
